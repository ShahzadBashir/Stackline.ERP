services:
  postgres:
    image: postgres:18
    container_name: stackline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_MASTER_DB}
    ports:
      - "5432:5432"
    volumes:
      - erp_postgres_data:/var/lib/postgresql

volumes:
  erp_postgres_data: